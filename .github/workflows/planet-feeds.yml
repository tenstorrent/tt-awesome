name: Fetch planet feeds
on:
  schedule:
    # Every 3 hours, 8x/day — offset from the github_meta run (02:17)
    - cron: "23 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch planet feeds
        run: python3 scripts/fetch_planet_feeds.py
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/planet_feeds.json
          git diff --cached --quiet || git commit -m "chore: update planet feeds"
          git push
