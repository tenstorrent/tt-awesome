name: Fetch planet feeds
on:
  schedule:
    - cron: "43 6,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml  # prompts/*.prompt.yml parsing (scripts/llm_client.py)
      - name: Fetch planet feeds
        env:
          # Optional — used to render connpass event descriptions as bilingual
          # EN + JA summaries. The fetcher degrades to Japanese-only when the
          # active provider's credential is absent.
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
          # Unused unless SUMMARY_PROVIDER=anthropic; keeps that switch working.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Flip the summarization backend with repository Variables (see
          # scripts/llm_client.py): "foundry" (default when unset) | "anthropic".
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
        run: python3 scripts/fetch_planet_feeds.py

      # fetch_planet_feeds.py writes pr-body.md (digest + template) only when it
      # added something. Fall back to the bare template otherwise, so the action
      # always has a body-path to read.
      - name: Prepare PR body
        run: |
          if [ ! -f pr-body.md ]; then
            cp .github/pr-templates/planet-feeds.md pr-body.md
          fi

      - name: Create pull request if changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # Open the PR as a collaborator, not as github-actions[bot]. The bot has
          # no collaborator permission on this repo, so the pull_request runs its
          # PRs trigger (Build check, Validate entries) sit in "Approve and run"
          # every night, and an approval never carries over: it covers one run on
          # one commit, and this branch is deleted and recreated each night.
          # The job-level guard in build-check.yml cannot help either, since job
          # conditions are evaluated after the run is approved, and pull_request
          # branch filters match the base branch, so the head branch cannot be
          # excluded at the trigger. A token that belongs to a collaborator is
          # what removes the gate. NIGHTLY_PR_TOKEN is a fine-grained PAT scoped
          # to this repo with contents:write and pull-requests:write (or a GitHub
          # App installation token). Until the secret exists this falls back to
          # the default token and behaves exactly as before.
          token: ${{ secrets.NIGHTLY_PR_TOKEN || github.token }}
          add-paths: src/_data/planet_feeds.json
          # No [skip ci]: single-commit PRs squash-merge with this message as
          # the commit title, and it must not suppress the Pages deploy on main.
          # (With the default token the bot's pushes still created pull_request
          # runs; they just waited in the approval queue. See the token note.)
          commit-message: "chore: update planet feeds"
          branch: "chore/nightly-planet-feeds"
          delete-branch: true
          title: "chore: update planet feeds"
          # Body comes from pr-body.md — this run's digest of what it added (with
          # anything awaiting approval called out), or the bare template when
          # nothing was added. The boilerplate lives in
          # .github/pr-templates/planet-feeds.md, shared with pr_digest.py so
          # there is only one copy of it.
          body-path: pr-body.md

      # The branch is reused across runs, so each run's body-path REPLACES the
      # previous run's digest. Post it as a comment too: a PR that accumulates
      # several runs before merge then keeps the history of what each one added.
      - name: Comment this run's digest on the PR
        if: ${{ steps.cpr.outputs.pull-request-number && hashFiles('pr-body.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Only comment when this run actually produced a digest — the bare
          # template carries no heading and is not worth a notification.
          if ! grep -q '^### ' pr-body.md; then
            echo "No digest in pr-body.md (nothing new); skipping comment."
            exit 0
          fi
          {
            echo "<!-- tt-awesome-digest run:${GITHUB_RUN_ID} -->"
            echo "🤖 Run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) added:"
            echo
            # Strip the shared boilerplate (everything from the marker that
            # pr_digest.py writes) so the comment is just this run's additions.
            sed '/tt-awesome-digest-boilerplate/,$d' pr-body.md
          } > digest-comment.md
          gh pr comment "$PR" --body-file digest-comment.md
