name: Validate entries
# Nightly automation PRs (chore/nightly-*) are excluded at the trigger: their
# author is github-actions[bot], which is not a collaborator, so every run it
# triggers waits in "Approve and run" (see the note in build-check.yml). The
# nightly workflow that edits entries/** runs scripts/validate.py itself before
# it opens the PR, so those entries are still checked.
on:
  pull_request:
    branches-ignore:
      - "chore/nightly-*"
    paths: ["entries/**", "scripts/validate.py"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 scripts/validate.py
