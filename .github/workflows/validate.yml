name: Validate entries
on:
  pull_request:
    paths: ["entries/**", "scripts/validate.py"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 scripts/validate.py
