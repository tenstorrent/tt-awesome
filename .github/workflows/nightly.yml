name: Fetch GitHub metadata
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print summaries, write nothing"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  models: read  # lets GITHUB_TOKEN call GitHub Models when SUMMARY_PROVIDER=github
concurrency:
  group: nightly-github-meta
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Flip the summarization backend with repository Variables — no code
      # change: SUMMARY_PROVIDER = "anthropic" (default when unset) or
      # "github" (GitHub Models via GITHUB_TOKEN; catalog at
      # https://github.com/marketplace/models). SUMMARY_MODEL optionally
      # overrides the model for either provider.
      SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml  # prompts/*.prompt.yml parsing (scripts/llm_client.py)

      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_meta.py

      - name: Summarize new releases
        # Runs when the active provider has a credential: the github provider
        # always has GITHUB_TOKEN; the anthropic default needs the API key.
        if: ${{ vars.SUMMARY_PROVIDER == 'github' || env.ANTHROPIC_API_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/summarize_releases.py $FLAGS

      - name: Regenerate README
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/generate_readme.py

      - name: Create pull request if changed
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/_data/github_meta.json
            src/_data/planet_feeds.json
            README.md
          # No [skip ci]: single-commit PRs squash-merge with this message as
          # the commit title, and it must not suppress the Pages deploy on main.
          # (The bot's own branch pushes use GITHUB_TOKEN, which never triggers
          # workflows, so [skip ci] added nothing there.)
          commit-message: "chore: update GitHub metadata"
          branch: "chore/nightly-github-metadata"
          delete-branch: true
          title: "chore: update GitHub metadata"
          body: |
            Automated GitHub metadata refresh.
