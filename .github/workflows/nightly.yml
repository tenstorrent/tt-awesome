name: Fetch GitHub metadata
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print summaries, write nothing"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nightly-github-meta
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_meta.py

      - name: Push github_meta.json directly to main
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/github_meta.json
          if git diff --cached --quiet; then
            echo "github_meta.json unchanged — nothing to push"
          else
            git commit -m "chore: update GitHub metadata"
            git push
          fi

      - name: Summarize new releases
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/summarize_releases.py $FLAGS

      - name: Open PR for planet_feeds.json if changed
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/_data/planet_feeds.json
          commit-message: "chore: update planet feeds [skip ci]"
          branch: "chore/nightly-planet-feeds"
          delete-branch: true
          title: "chore: update planet feeds"
          body: |
            Automated release-feed refresh.

            Review new items (`"approved": false`) and flip to `true` to publish on Planet Tenstorrent.
