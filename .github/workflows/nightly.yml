name: Fetch GitHub metadata
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_meta.py
      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/_data/github_meta.json
          commit-message: "chore: update GitHub metadata [skip ci]"
          branch: "chore/nightly-github-metadata"
          delete-branch: true
          title: "chore: update GitHub metadata"
          body: "Automated nightly metadata refresh."
