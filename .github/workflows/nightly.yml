name: Fetch GitHub metadata
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print summaries, write nothing"
        type: boolean
        default: false
concurrency:
  group: nightly-github-meta
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    # DRAFT (OSPO-1137): permissions are job-level, as the OSPO Vault runbook asks.
    # id-token: write lets this job prove its identity to OSPO Vault; it grants no
    # write access to the repository. contents/pull-requests: write are what the
    # built-in GITHUB_TOKEN needs to open the nightly PR.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # DRAFT (OSPO-1137): OSPO Vault, reachable over Tailscale only.
      VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com
      # Summarization runs on Claude via Microsoft Foundry (scripts/llm_client.py).
      # FOUNDRY_API_KEY is no longer a GitHub secret: the "Get secrets from Vault"
      # step below reads it and hands it only to the step that needs it.
      # Optional: point at a different Foundry resource without a code change.
      FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
      # The Anthropic-direct escape hatch (SUMMARY_PROVIDER=anthropic) is not
      # wired to Vault in this draft: ANTHROPIC_API_KEY is no longer passed in.
      # Flip the backend with repository Variables, no code change:
      # SUMMARY_PROVIDER = "foundry" (default when unset) or "anthropic".
      # The old "github" (GitHub Models) value no longer works — that service
      # was retired 2026-07-30 and now answers every request with HTTP 410.
      # SUMMARY_MODEL optionally overrides the model for either provider.
      SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # DRAFT (OSPO-1137): join the tailnet, wait for Vault, read the secret.
      # Steps copied from the OSPO runbook; only the two REPLACE values change,
      # and OSPO supplies them on the ticket.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_VAULT_OSPO_CLIENT_ID }}
          audience: ${{ vars.TS_VAULT_OSPO_AUDIENCE }}
          tags: tag:tt-gha-vault-ospo
          args: --accept-routes
      - name: Wait for Vault
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 "${VAULT_URL}/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204" >/dev/null && exit 0
            sleep 2
          done
          echo "Vault ${VAULT_URL} did not become reachable over Tailscale" >&2
          exit 1
      - name: Get secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: jwt-github
          role: <role-name>                                    # REPLACE: role name from the OSPO ticket
          jwtGithubAudience: ${{ env.VAULT_URL }}
          exportEnv: false
          secrets: |
            <secret-path> <key> | FOUNDRY_API_KEY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install pyyaml  # prompts/*.prompt.yml parsing (scripts/llm_client.py)

      # Besides stars/releases, this step detects repos GitHub now reports
      # under a new owner or name. It moves the entry's repo link, records the
      # old name in the entry's previous_repos, and writes repo-renames.md for
      # the PR body below. Name/description/id are left for the reviewer.
      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/fetch_github_meta.py $FLAGS

      - name: Summarize new releases
        # Skipped entirely when no Foundry credential is configured. When one is
        # present the script exits non-zero if every summarization call fails,
        # so a dead backend turns the run red instead of quietly opening a PR
        # that summarized nothing.
        if: ${{ steps.vault.outputs.FOUNDRY_API_KEY != '' }}
        env:
          FOUNDRY_API_KEY: ${{ steps.vault.outputs.FOUNDRY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/summarize_releases.py $FLAGS

      - name: Regenerate README
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/generate_readme.py

      # summarize_releases.py writes pr-body.md (digest + template) only when it
      # added something. Fall back to the bare template otherwise, so the
      # action always has a body-path to read. A repo-renames.md from the fetch
      # step goes first: it carries a "### " heading, so the comment step below
      # surfaces it in the PR notification, and it sits above the boilerplate
      # marker that step strips.
      - name: Prepare PR body
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -f pr-body.md ]; then
            cp .github/pr-templates/github-metadata.md pr-body.md
          fi
          if [ -f repo-renames.md ]; then
            cat repo-renames.md pr-body.md > pr-body.tmp && mv pr-body.tmp pr-body.md
          fi

      - name: Create pull request if changed
        id: cpr
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          add-paths: |
            src/_data/github_meta.json
            src/_data/planet_feeds.json
            README.md
            entries/**/*.json
          # No [skip ci]: single-commit PRs squash-merge with this message as
          # the commit title, and it must not suppress the Pages deploy on main.
          # (The bot's own branch pushes use GITHUB_TOKEN, which never triggers
          # workflows, so [skip ci] added nothing there.)
          commit-message: "chore: update GitHub metadata"
          branch: "chore/nightly-github-metadata"
          delete-branch: true
          title: "chore: update GitHub metadata"
          # Body comes from pr-body.md — the run's digest of what it summarized,
          # or the bare template when nothing was added. The boilerplate lives in
          # .github/pr-templates/github-metadata.md, shared with pr_digest.py so
          # there is only one copy of it.
          body-path: pr-body.md

      # The branch is reused across runs, so each run's body-path REPLACES the
      # previous run's digest. Post it as a comment too: a PR that accumulates
      # several runs before merge then keeps the history of what each one added.
      - name: Comment this run's digest on the PR
        if: ${{ !inputs.dry_run && steps.cpr.outputs.pull-request-number && hashFiles('pr-body.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Only comment when this run actually produced a digest — the bare
          # template carries no heading and is not worth a notification.
          if ! grep -q '^### ' pr-body.md; then
            echo "No digest in pr-body.md (nothing summarized); skipping comment."
            exit 0
          fi
          {
            echo "<!-- tt-awesome-digest run:${GITHUB_RUN_ID} -->"
            echo "🤖 Run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) added:"
            echo
            # Strip the shared boilerplate (everything from the marker that
            # pr_digest.py writes) so the comment is just this run's additions.
            sed '/tt-awesome-digest-boilerplate/,$d' pr-body.md
          } > digest-comment.md
          gh pr comment "$PR" --body-file digest-comment.md
