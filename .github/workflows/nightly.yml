name: Fetch GitHub metadata
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print summaries, write nothing"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  models: read
concurrency:
  group: nightly-github-meta
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_meta.py
      - name: Summarize new releases
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/summarize_releases.py $FLAGS
      - name: Create pull request if changed
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/_data/github_meta.json
            src/_data/planet_feeds.json
          commit-message: "chore: update GitHub metadata [skip ci]"
          branch: "chore/nightly-github-metadata"
          delete-branch: true
          title: "chore: update GitHub metadata"
          body: "Automated twice-daily metadata refresh."
