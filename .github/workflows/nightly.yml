name: Fetch GitHub metadata
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print summaries, write nothing"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nightly-github-meta
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_meta.py

      - name: Summarize new releases
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/summarize_releases.py $FLAGS

      - name: Regenerate README
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/generate_readme.py

      # github_meta.json is pure crawled data; summarize_releases.py items are
      # already approved:true; README.md is auto-generated — all go straight to
      # main so the site redeploys automatically.
      #
      # NOTE: if the repo has a branch protection rule requiring PRs on main,
      # this push will fail. Fix: add github-actions[bot] as a bypass actor in
      # Settings → Branches → Edit protection rule → Allow specified actors to bypass.
      - name: Push data files directly to main
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/github_meta.json src/_data/planet_feeds.json README.md
          if git diff --cached --quiet; then
            echo "No data changes — nothing to push"
          else
            git commit -m "chore: update GitHub metadata"
            git push
          fi
