name: Nightly refresh
# One scheduled run refreshes everything that feeds the site and opens ONE pull request:
#   1. GitHub metadata and release summaries   (fetch_github_meta.py, summarize_releases.py, generate_readme.py)
#   2. Planet feeds                            (fetch_planet_feeds.py)
#   3. The models list and, on Thursdays, the weekly models roundup   (build_models_data.py, models_diff.py)
# This replaces the separate nightly.yml, planet-feeds.yml and nightly-models.yml. The change is
# reviewed and merged, and the merge to main deploys. The deploy job itself never fetches anything.
#
# DRAFT (OSPO-1137): the only credential is FOUNDRY_API_KEY, which comes from OSPO Vault, not from a
# GitHub secret. The Vault `role` and secret path below are placeholders until OSPO supplies them.
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print summaries and the models diff stat, write nothing, open no PR"
        type: boolean
        default: false
      roundup:
        description: "Write (or rewrite) this week's 'Models this week' Planet item, whatever the weekday"
        type: boolean
        default: false
# Nothing is written to the repo with a token that has run downloaded code. The "models" job installs
# and runs tt-model with a read-only token and hands models.json over as an artifact. The "refresh"
# job has write access and runs only this repo's own files.
permissions:
  contents: read
concurrency:
  group: nightly-refresh
  cancel-in-progress: true
env:
  # tt-model-manager is installed from this exact commit, so a change on its main branch cannot run in
  # this job unreviewed. To update tt-model, change the commit in a PR.
  TT_MODEL_COMMIT: 713eeb2f33354881beca0fffc2b1ffe15bb5867d
  # The catalog search asks for this many rows; build_models_data.py fails if it gets exactly this many,
  # because the listing was then cut off.
  CATALOG_LIMIT: "300"
jobs:
  # ---------------------------------------------------------------------------------------------
  # models: rebuild src/_data/models.json from tt-inference-server (main branch; takes precedence) and
  # tt-model (`tt-model search --catalog` and each bundle's manifest). Read-only, no credentials,
  # because it runs downloaded code.
  # ---------------------------------------------------------------------------------------------
  models:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }

      # tt-inference-server: the release spec, the file that names its hardware, and the list of support pages.
      - name: Fetch the tt-inference-server release spec
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tenstorrent/tt-inference-server
          path: .tt-inference-server
          sparse-checkout: |
            release_model_spec.json
            workflows/workflow_types.py
            docs/model_support
          sparse-checkout-cone-mode: false
          persist-credentials: false
          # Read-only, with the default token (github.token). tt-inference-server is public, so the
          # optional MODELS_SOURCE_TOKEN stored secret is gone: a stored token does not expire.
          token: ${{ github.token }}

      # tt-model, for `tt-model search`. It only lists Hub repos; it opens no device. No Hugging Face
      # token is passed: the repository never had one set.
      - name: Install tt-model at a pinned commit
        run: |
          pip install "git+https://github.com/tenstorrent/tt-model-manager.git@${TT_MODEL_COMMIT}"
          tt-model --help > /dev/null

      - name: Read the tt-model catalog
        run: tt-model search --catalog --json --limit "$CATALOG_LIMIT" > catalog.json

      # --hf-cards: each original model's Hugging Face card (pipeline tag, tags), a source of kind and
      # purpose for bundles whose card states no task. Cached so the order check below reads the same.
      - name: Build models.json
        run: |
          python3 scripts/build_models_data.py \
            --isrv .tt-inference-server --catalog catalog.json --limit "$CATALOG_LIMIT" \
            --manifests manifests.json --hf-cards hf_cards.json \
            --spec-commit "$(git -C .tt-inference-server rev-parse --short=9 HEAD)"
          git --no-pager diff --stat -- src/_data/models.json || true

      # The same inputs in another catalog order must give the same file, or the nightly PR would show changes
      # that are only ordering. The manifests are read from the cache the first build wrote.
      - name: Check the output does not depend on catalog order
        run: |
          python3 -c "import json; c = json.load(open('catalog.json')); json.dump(c[::-1], open('catalog_reversed.json', 'w'))"
          python3 scripts/build_models_data.py \
            --isrv .tt-inference-server --catalog catalog_reversed.json --limit "$CATALOG_LIMIT" \
            --manifests manifests.json --hf-cards hf_cards.json --out models_reversed.json \
            --spec-commit "$(git -C .tt-inference-server rev-parse --short=9 HEAD)"
          cmp src/_data/models.json models_reversed.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models-json
          path: src/_data/models.json
          retention-days: 3

  # ---------------------------------------------------------------------------------------------
  # refresh: metadata, release summaries, planet feeds and the models digest, then one PR.
  # `!cancelled()` keeps the metadata and planet feeds going when the models job fails, as they did
  # when these were separate workflows. The run still shows red.
  # ---------------------------------------------------------------------------------------------
  refresh:
    needs: models
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # DRAFT (OSPO-1137): permissions are job-level, as the OSPO Vault runbook asks.
    # id-token: write lets this job prove its identity to OSPO Vault; it grants no write access to
    # the repository. contents/pull-requests: write are what the built-in GITHUB_TOKEN needs to open
    # the PR.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # DRAFT (OSPO-1137): OSPO Vault, reachable over Tailscale only.
      VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com
      # Summarization runs on Claude via Microsoft Foundry (scripts/llm_client.py). FOUNDRY_API_KEY is
      # not a GitHub secret: the "Get secrets from Vault" step reads it and hands it only to the
      # steps that need it. The Anthropic-direct escape hatch (SUMMARY_PROVIDER=anthropic) is not
      # wired to Vault: ANTHROPIC_API_KEY is not passed in.
      # Optional: point at a different Foundry resource without a code change.
      FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
      # SUMMARY_PROVIDER = "foundry" (default when unset). The old "github" (GitHub Models) value no
      # longer works: that service was retired 2026-07-30 and now answers every request with HTTP 410.
      # SUMMARY_MODEL optionally overrides the model.
      SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The models roundup reads models.json as it was a week ago out of history (24 MB, ~370 commits).
          fetch-depth: 0

      # DRAFT (OSPO-1137): join the tailnet, wait for Vault, read the secret.
      # Steps copied from the OSPO runbook; only the two REPLACE values change,
      # and OSPO supplies them on the ticket.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_VAULT_OSPO_CLIENT_ID }}
          audience: ${{ vars.TS_VAULT_OSPO_AUDIENCE }}
          tags: tag:tt-gha-vault-ospo
          args: --accept-routes
      - name: Wait for Vault
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 "${VAULT_URL}/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204" >/dev/null && exit 0
            sleep 2
          done
          echo "Vault ${VAULT_URL} did not become reachable over Tailscale" >&2
          exit 1
      - name: Get secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: jwt-github
          role: <role-name>                                    # REPLACE: role name from the OSPO ticket
          jwtGithubAudience: ${{ env.VAULT_URL }}
          exportEnv: false
          secrets: |
            <secret-path> <key> | FOUNDRY_API_KEY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install pyyaml  # prompts/*.prompt.yml parsing (scripts/llm_client.py)

      # Each script below writes its PR digest to its own file under pr-parts/ (PR_BODY_PATH, or --out
      # for models_diff.py). "Assemble the PR body" joins them into the one PR body.
      - run: mkdir -p pr-parts

      # ---- 1. GitHub metadata and release summaries ----------------------------------------------
      # Besides stars/releases, this step detects repos GitHub now reports under a new owner or name.
      # It moves the entry's repo link, records the old name in the entry's previous_repos, and writes
      # repo-renames.md for the PR body. Name/description/id are left for the reviewer.
      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/fetch_github_meta.py $FLAGS

      - name: Summarize new releases
        # Skipped entirely when Vault returned no Foundry credential. When one is present the script
        # exits non-zero if every summarization call fails, so a dead backend turns the run red
        # instead of quietly opening a PR that summarized nothing.
        if: ${{ steps.vault.outputs.FOUNDRY_API_KEY != '' }}
        env:
          FOUNDRY_API_KEY: ${{ steps.vault.outputs.FOUNDRY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY_PATH: pr-parts/releases.md
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/summarize_releases.py $FLAGS

      - name: Regenerate README
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/generate_readme.py

      # ---- 2. Planet feeds -----------------------------------------------------------------------
      - name: Fetch planet feeds
        env:
          # Optional: used to render connpass event descriptions as bilingual EN + JA summaries. The
          # fetcher degrades to Japanese-only when the credential is absent.
          FOUNDRY_API_KEY: ${{ steps.vault.outputs.FOUNDRY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY_PATH: pr-parts/planet.md
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python3 scripts/fetch_planet_feeds.py $FLAGS

      # ---- 3. Models ------------------------------------------------------------------------------
      # create-pull-request rebuilds the PR branch from main plus this run's tree, so a Thursday
      # roundup that is still unmerged on Friday would silently fall out of the PR. Keep it. This does
      # not depend on the models job: the item is already in planet_feeds.json on the branch.
      - name: Carry forward an unmerged roundup
        if: ${{ !inputs.dry_run }}
        run: |
          if git fetch --quiet origin chore/nightly-refresh 2>/dev/null; then
            git show origin/chore/nightly-refresh:src/_data/planet_feeds.json > branch-feeds.json
            python3 scripts/models_diff.py carry-forward --from branch-feeds.json
          else
            echo "No open PR branch; nothing to carry forward."
          fi

      # The models steps run only when the models job produced a list, and never on a dry run.
      # Into new/, not src/_data: the committed file must stay on disk as the "old" side of the diff below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.models.result == 'success' && !inputs.dry_run }}
        with:
          name: models-json
          path: new

      # pr-parts/models.md lists what the run changed (models added, status changes, new bundles, ...).
      # It is left absent when nothing changed.
      - name: Describe the model changes
        if: ${{ needs.models.result == 'success' && !inputs.dry_run }}
        run: python3 scripts/models_diff.py pr-body --old src/_data/models.json --new new/models.json --out pr-parts/models.md

      # Once a week, one Planet item: the models that arrived over the seven days ending today, across
      # tt-inference-server and tt-model bundles. The item is keyed by ISO week in its URL. A second
      # scheduled run in the same week writes nothing; a dispatch with roundup=true replaces the
      # week's item, which is how a week is regenerated after a prompt or data change.
      - name: Weekly models roundup (Thursdays)
        if: ${{ needs.models.result == 'success' && !inputs.dry_run && steps.vault.outputs.FOUNDRY_API_KEY != '' && (inputs.roundup || github.event_name == 'schedule') }}
        env:
          FOUNDRY_API_KEY: ${{ steps.vault.outputs.FOUNDRY_API_KEY }}
          FORCE: ${{ inputs.roundup }}
        run: |
          if [ "$FORCE" != "true" ] && [ "$(date -u +%u)" != "4" ]; then
            echo "Not Thursday; no roundup."
            exit 0
          fi
          OLD=$(git rev-list -1 --before="7 days ago" HEAD)
          if [ -z "$OLD" ]; then
            echo "No commit older than 7 days; no roundup."
            exit 0
          fi
          git show "$OLD:src/_data/models.json" > old-week.json
          # A forced run is how a week is regenerated after a prompt change, so it replaces.
          REPLACE=""
          if [ "$FORCE" = "true" ]; then REPLACE="--replace"; fi
          python3 scripts/models_diff.py roundup --old old-week.json --new new/models.json --week-end "$(date -u +%F)" $REPLACE

      - name: Use the new models list
        if: ${{ needs.models.result == 'success' && !inputs.dry_run }}
        run: cp new/models.json src/_data/models.json

      # ---- One PR body -----------------------------------------------------------------------------
      # Layout: run link, files changed, one section per part that has something to say (metadata and
      # releases, planet feeds, models), then collapsed review notes. pr-digest.md holds just the
      # sections; the comment step below posts it, because the PR body is replaced on every run.
      - name: Assemble the PR body
        if: ${{ !inputs.dry_run }}
        run: |
          RUN="[\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          # Each part ends with a boilerplate block after a marker; keep only the per-run digest.
          digest() { sed '/tt-awesome-digest-boilerplate/,$d' "$1"; }
          # A part counts only when it carries a "### " heading: the bare templates do not.
          section() {
            [ -f "$2" ] && grep -q '^### ' "$2" || return 0
            { echo "## $1"; echo; digest "$2"; echo; } >> pr-digest.md
          }

          : > pr-parts/metadata.md
          if [ -f repo-renames.md ]; then cat repo-renames.md >> pr-parts/metadata.md; echo >> pr-parts/metadata.md; fi
          if [ -f pr-parts/releases.md ]; then digest pr-parts/releases.md >> pr-parts/metadata.md; fi

          : > pr-digest.md
          section "GitHub metadata and release summaries" pr-parts/metadata.md
          section "Planet feeds" pr-parts/planet.md
          section "Models" pr-parts/models.md
          # The PR body and the comment are each limited to 65,536 characters.
          head -c 50000 pr-digest.md | iconv -f UTF-8 -t UTF-8 -c > pr-digest.tmp && mv pr-digest.tmp pr-digest.md

          {
            echo "Automated nightly refresh: GitHub metadata and release summaries, planet feeds, and the models list. Run ${RUN}."
            echo
            echo "## Files changed"
            echo
            echo '```'
            git status --short -- src/_data/github_meta.json src/_data/planet_feeds.json src/_data/models.json README.md entries
            echo '```'
            echo
            if [ -s pr-digest.md ]; then
              cat pr-digest.md
            else
              echo "No digest this run: the data files changed without new releases, feed items or model changes."
              echo
            fi
            echo "## How to review"
            echo
            for t in github-metadata:"GitHub metadata and release summaries" planet-feeds:"Planet feeds" models:"Models"; do
              echo "<details><summary>${t#*:}</summary>"
              echo
              grep -v 'tt-awesome-digest-boilerplate' ".github/pr-templates/${t%%:*}.md"
              echo
              echo "</details>"
              echo
            done
          } > pr-body.md

      - name: Create pull request if changed
        id: cpr
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          add-paths: |
            src/_data/github_meta.json
            src/_data/planet_feeds.json
            src/_data/models.json
            README.md
            entries/**/*.json
          # No [skip ci]: single-commit PRs squash-merge with this message as the commit title, and it
          # must not suppress the Pages deploy on main. (The bot's own branch pushes use GITHUB_TOKEN,
          # which never triggers workflows, so [skip ci] added nothing there.)
          commit-message: "chore: nightly refresh"
          # Keep the chore/nightly- prefix: build-check.yml skips pull requests from these branches.
          branch: "chore/nightly-refresh"
          delete-branch: true
          title: "chore: nightly refresh"
          body-path: pr-body.md

      # The branch is reused across runs, so each run's body-path REPLACES the previous run's body.
      # Post the digest as a comment too: a PR that accumulates several runs before merge then keeps
      # the history of what each one added.
      - name: Comment this run's digest on the PR
        if: ${{ !inputs.dry_run && steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Only comment when this run actually produced a digest.
          if [ ! -s pr-digest.md ]; then
            echo "No digest this run; skipping comment."
            exit 0
          fi
          {
            echo "<!-- tt-awesome-digest run:${GITHUB_RUN_ID} -->"
            echo "🤖 Run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}):"
            echo
            cat pr-digest.md
          } > digest-comment.md
          gh pr comment "$PR" --body-file digest-comment.md
