name: Fetch GitHub metadata
on:
  schedule:
    # Every 3 hours, 8x/day — offset from planet feeds run (:23)
    - cron: "47 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_meta.py
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/github_meta.json
          git diff --cached --quiet || git commit -m "chore: update GitHub metadata"
          git push
