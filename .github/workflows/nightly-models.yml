name: Refresh models list
# Rebuilds src/_data/models.json (the Models pages of the site) from
#   1. tt-inference-server's main branch (release spec, hardware names, support pages; takes precedence), and
#   2. tt-model: the community catalog (`tt-model search --catalog`) and each bundle's manifest (`tt-model info`),
# then opens a PR if the list changed. Same pattern as nightly.yml: the change is reviewed and merged,
# and the merge to main deploys. The deploy job itself never fetches anything.
on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the list and print the diff, open no PR"
        type: boolean
        default: false
      roundup:
        description: "Write (or rewrite) this week's 'Models this week' Planet item, whatever the weekday"
        type: boolean
        default: false
# Nothing is written to the repo with a token that has run downloaded code. The "build" job installs
# and runs tt-model with a read-only token and hands models.json over as an artifact. The "pr" job has
# write access and runs only this repo's own files.
permissions:
  contents: read
concurrency:
  group: nightly-models
  cancel-in-progress: true
env:
  # tt-model-manager is installed from this exact commit, so a change on its main branch cannot run in
  # this job unreviewed. To update tt-model, change the commit in a PR.
  TT_MODEL_COMMIT: 713eeb2f33354881beca0fffc2b1ffe15bb5867d
  # The catalog search asks for this many rows; build_models_data.py fails if it gets exactly this many,
  # because the listing was then cut off.
  CATALOG_LIMIT: "300"
jobs:
  build:
    runs-on: ubuntu-latest
    # DRAFT (OSPO-1137): id-token: write lets this job prove its identity to OSPO Vault; it grants
    # no write access to the repository. OPEN QUESTION FOR OSPO: this job runs downloaded code
    # (tt-model), so giving it a Vault identity is a trade-off. Its Vault role should be limited to
    # the read-only Hugging Face token. The alternative is to drop HF_TOKEN here and search the Hub
    # unauthenticated.
    permissions:
      contents: read
      id-token: write
    env:
      # DRAFT (OSPO-1137): OSPO Vault, reachable over Tailscale only.
      VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # DRAFT (OSPO-1137): join the tailnet, wait for Vault, read the Hugging Face token.
      # Steps copied from the OSPO runbook; only the two REPLACE values change,
      # and OSPO supplies them on the ticket. This runs before any downloaded code.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_VAULT_OSPO_CLIENT_ID }}
          audience: ${{ vars.TS_VAULT_OSPO_AUDIENCE }}
          tags: tag:tt-gha-vault-ospo
          args: --accept-routes
      - name: Wait for Vault
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 "${VAULT_URL}/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204" >/dev/null && exit 0
            sleep 2
          done
          echo "Vault ${VAULT_URL} did not become reachable over Tailscale" >&2
          exit 1
      - name: Get secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: jwt-github
          role: <role-name>                                    # REPLACE: role name from the OSPO ticket
          jwtGithubAudience: ${{ env.VAULT_URL }}
          exportEnv: false
          secrets: |
            <secret-path> <key> | HF_TOKEN

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }

      # tt-inference-server: the release spec, the file that names its hardware, and the list of support pages.
      - name: Fetch the tt-inference-server release spec
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tenstorrent/tt-inference-server
          path: .tt-inference-server
          sparse-checkout: |
            release_model_spec.json
            workflows/workflow_types.py
            docs/model_support
          sparse-checkout-cone-mode: false
          persist-credentials: false
          # Read-only, with the default token (github.token). tt-inference-server is public, so the
          # optional MODELS_SOURCE_TOKEN stored secret is gone: a stored token does not expire.
          token: ${{ github.token }}

      # tt-model, for `tt-model search`. It only lists Hub repos; it opens no device.
      - name: Install tt-model at a pinned commit
        run: |
          pip install "git+https://github.com/tenstorrent/tt-model-manager.git@${TT_MODEL_COMMIT}"
          tt-model --help > /dev/null

      - name: Read the tt-model catalog
        env:
          HF_TOKEN: ${{ steps.vault.outputs.HF_TOKEN }}
        run: tt-model search --catalog --json --limit "$CATALOG_LIMIT" > catalog.json

      # --hf-cards: each original model's Hugging Face card (pipeline tag, tags), a source of kind and
      # purpose for bundles whose card states no task. Cached so the order check below reads the same.
      - name: Build models.json
        env:
          HF_TOKEN: ${{ steps.vault.outputs.HF_TOKEN }}
        run: |
          python3 scripts/build_models_data.py \
            --isrv .tt-inference-server --catalog catalog.json --limit "$CATALOG_LIMIT" \
            --manifests manifests.json --hf-cards hf_cards.json \
            --spec-commit "$(git -C .tt-inference-server rev-parse --short=9 HEAD)"
          git --no-pager diff --stat -- src/_data/models.json || true

      # The same inputs in another catalog order must give the same file, or the nightly PR would show changes
      # that are only ordering. The manifests are read from the cache the first build wrote.
      - name: Check the output does not depend on catalog order
        run: |
          python3 -c "import json; c = json.load(open('catalog.json')); json.dump(c[::-1], open('catalog_reversed.json', 'w'))"
          python3 scripts/build_models_data.py \
            --isrv .tt-inference-server --catalog catalog_reversed.json --limit "$CATALOG_LIMIT" \
            --manifests manifests.json --hf-cards hf_cards.json --out models_reversed.json \
            --spec-commit "$(git -C .tt-inference-server rev-parse --short=9 HEAD)"
          cmp src/_data/models.json models_reversed.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models-json
          path: src/_data/models.json
          retention-days: 3

  pr:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # DRAFT (OSPO-1137): id-token: write lets this job prove its identity to OSPO Vault; it grants
    # no write access to the repository. contents/pull-requests: write are what the built-in
    # GITHUB_TOKEN needs to open the PR.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # DRAFT (OSPO-1137): OSPO Vault, reachable over Tailscale only.
      VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com
      # The weekly roundup's one model call (scripts/models_diff.py), wired like nightly.yml's
      # summarization. The roundup step is skipped when the credential is absent. Only this job sees
      # the Foundry key (read from Vault below): the build job runs tt-model, which is downloaded
      # code. The Anthropic-direct escape hatch (SUMMARY_PROVIDER=anthropic) is not wired to Vault
      # in this draft: ANTHROPIC_API_KEY is no longer passed in.
      FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
      SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The roundup reads models.json as it was a week ago out of history (24 MB, ~370 commits).
          fetch-depth: 0

      # DRAFT (OSPO-1137): join the tailnet, wait for Vault, read the secret.
      # Steps copied from the OSPO runbook; only the two REPLACE values change,
      # and OSPO supplies them on the ticket.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_VAULT_OSPO_CLIENT_ID }}
          audience: ${{ vars.TS_VAULT_OSPO_AUDIENCE }}
          tags: tag:tt-gha-vault-ospo
          args: --accept-routes
      - name: Wait for Vault
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 "${VAULT_URL}/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204" >/dev/null && exit 0
            sleep 2
          done
          echo "Vault ${VAULT_URL} did not become reachable over Tailscale" >&2
          exit 1
      - name: Get secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: jwt-github
          role: <role-name>                                    # REPLACE: role name from the OSPO ticket
          jwtGithubAudience: ${{ env.VAULT_URL }}
          exportEnv: false
          secrets: |
            <secret-path> <key> | FOUNDRY_API_KEY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install pyyaml  # prompts/*.prompt.yml parsing (scripts/llm_client.py)

      # Into new/, not src/_data: the committed file must stay on disk as the "old" side of the
      # nightly diff below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: models-json
          path: new

      # pr-body.md lists what the run changed (models added, status changes, new bundles, ...). It is
      # left absent when nothing changed, and the "Prepare PR body" step then uses the bare template.
      - name: Describe the changes for the PR body
        run: python3 scripts/models_diff.py pr-body --old src/_data/models.json --new new/models.json --out pr-body.md

      # create-pull-request rebuilds the PR branch from main plus this run's tree, so a Thursday
      # roundup that is still unmerged on Friday would silently fall out of the PR. Keep it.
      - name: Carry forward an unmerged roundup
        run: |
          if git fetch --quiet origin chore/nightly-models 2>/dev/null; then
            git show origin/chore/nightly-models:src/_data/planet_feeds.json > branch-feeds.json
            python3 scripts/models_diff.py carry-forward --from branch-feeds.json
          else
            echo "No open PR branch; nothing to carry forward."
          fi

      # Once a week, one Planet item: the models that arrived over the seven days ending today,
      # across tt-inference-server and tt-model bundles. The item is keyed by ISO week in its URL. A
      # second scheduled run in the same week writes nothing; a dispatch with roundup=true replaces
      # the week's item, which is how a week is regenerated after a prompt or data change.
      - name: Weekly roundup (Thursdays)
        if: ${{ steps.vault.outputs.FOUNDRY_API_KEY != '' && (inputs.roundup || github.event_name == 'schedule') }}
        env:
          FOUNDRY_API_KEY: ${{ steps.vault.outputs.FOUNDRY_API_KEY }}
          FORCE: ${{ inputs.roundup }}
        run: |
          if [ "$FORCE" != "true" ] && [ "$(date -u +%u)" != "4" ]; then
            echo "Not Thursday; no roundup."
            exit 0
          fi
          OLD=$(git rev-list -1 --before="7 days ago" HEAD)
          if [ -z "$OLD" ]; then
            echo "No commit older than 7 days; no roundup."
            exit 0
          fi
          git show "$OLD:src/_data/models.json" > old-week.json
          # A forced run is how a week is regenerated after a prompt change, so it replaces.
          REPLACE=""
          if [ "$FORCE" = "true" ]; then REPLACE="--replace"; fi
          python3 scripts/models_diff.py roundup --old old-week.json --new new/models.json --week-end "$(date -u +%F)" $REPLACE

      - name: Prepare PR body
        run: |
          cp new/models.json src/_data/models.json
          if [ ! -f pr-body.md ]; then
            cp .github/pr-templates/models.md pr-body.md
          fi

      - name: Create pull request if changed
        id: cpr
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          add-paths: |
            src/_data/models.json
            src/_data/planet_feeds.json
          commit-message: "chore: refresh models list"
          branch: "chore/nightly-models"
          delete-branch: true
          title: "chore: refresh models list"
          # The run's digest, or the bare template when nothing changed. The boilerplate lives in
          # .github/pr-templates/models.md so there is one copy of it.
          body-path: pr-body.md

      # The branch is reused across runs, so each run's body-path REPLACES the previous run's
      # digest. Post it as a comment too: a PR that accumulates several runs before merge then
      # keeps the history of what each one changed. Same step as nightly.yml.
      - name: Comment this run's digest on the PR
        if: ${{ steps.cpr.outputs.pull-request-number && hashFiles('pr-body.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Only comment when this run actually produced a digest — the bare template carries no
          # heading and is not worth a notification.
          if ! grep -q '^### ' pr-body.md; then
            echo "No digest in pr-body.md (nothing changed); skipping comment."
            exit 0
          fi
          {
            echo "<!-- tt-awesome-digest run:${GITHUB_RUN_ID} -->"
            echo "🤖 Run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) changed:"
            echo
            # Strip the shared boilerplate (everything from the marker in the template) so the
            # comment is just this run's changes.
            sed '/tt-awesome-digest-boilerplate/,$d' pr-body.md
          } > digest-comment.md
          gh pr comment "$PR" --body-file digest-comment.md
