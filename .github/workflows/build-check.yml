name: Build check
# Pre-merge parity with the deploy gate: build the site and run the
# build-output assertions (static entry pages, sitemap, crawl anchors,
# metadata, feed-id immutability) plus the data-layer unit suites, so a
# template/data regression is caught on the PR instead of turning main red
# after merge.
#
# The nightly automations (nightly.yml, planet-feeds.yml, nightly-models.yml)
# open PRs from `chore/nightly-*` branches that touch src/_data/*.json and
# entries/**, matching the paths below. Those PRs are excluded at the trigger
# with `branches-ignore`, not with a job-level `if`. The difference matters:
# the PR author is github-actions[bot], which is not a repo collaborator, so
# the repo's Actions approval policy parks every run it triggers in "Approve
# and run" before any job condition is evaluated. A job-level guard therefore
# still produced a daily approval prompt for a run that would only have
# skipped itself. A trigger filter is evaluated before the gate, so no run is
# created at all. (The approval is per run and per commit, and the nightly
# branch is deleted and recreated each night, so approvals could never stick.)
on:
  pull_request:
    branches-ignore:
      - "chore/nightly-*"
    paths:
      - "src/**"
      - "entries/**"
      - "tests/**"
      - "AGENTS.md"
      - ".eleventy.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-check.yml"
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Parity with deploy.yml: data.json is a build output, not tracked, so it
      # has to be generated here too or the passthrough copy silently serves
      # nothing and test_entry_pages.js's freshness check fails.
      - run: python3 scripts/generate_data_json.py
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run build
      - run: node tests/test_entry_pages.js
      - run: node tests/test_data_files.js
      - run: node tests/test_eleventy_filters.js
      - run: node tests/test_recent_releases.js
